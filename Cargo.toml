[workspace]
members = ["crates/ruckus-core", "crates/ruckus"]
exclude = ["vendor/gpui-component-0.5.1"]
resolver = "3"

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component-0.5.1" }

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/exec/ruckus"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

