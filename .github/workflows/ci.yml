name: CI

on:
  push:
    # Tags identify already-tested commits; release packaging belongs elsewhere.
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: Headless Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      # Keep feature sets and the local dependency patch separate even on fallback.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ruckus-v1
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust }}-headless-${{ hashFiles('Cargo.toml', 'vendor/**') }}
          cache-bin: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --no-default-features --locked
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --workspace --no-default-features --locked
      - run: cargo doc --workspace --no-deps --no-default-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
  desktop:
    name: GPUI macOS
    # Same Apple Silicon/macOS 26 family as the measured successful runs.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Fingerprint the selected native toolchain
        id: native-toolchain
        shell: bash
        run: |
          developer_dir="$(xcode-select -p)"
          xcode_version="$(xcodebuild -version)"
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          clang_version="$(xcrun clang --version)"
          fingerprint="$(printf '%s\n' "$developer_dir" "$xcode_version" "$sdk_path" "$sdk_version" "$clang_version" | shasum -a 256)"
          printf 'hash=%s\n' "${fingerprint%% *}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ruckus-v1
          key: ${{ runner.os }}-${{ runner.arch }}-macos-26-stable-gui-ui-tests-${{ steps.native-toolchain.outputs.hash }}-${{ hashFiles('Cargo.toml', 'vendor/**') }}
          env-vars: MACOSX_DEPLOYMENT_TARGET SDKROOT DEVELOPER_DIR
          cache-bin: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p ruckus --features ui-tests --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
